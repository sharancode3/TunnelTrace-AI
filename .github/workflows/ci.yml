name: TunnelTrace AI — Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: tunneltrace_user
          POSTGRES_PASSWORD: tunneltrace_test_password
          POSTGRES_DB: tunneltrace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Mypy Type Check
        run: |
          mypy backend/app

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tunneltrace_user:tunneltrace_test_password@localhost:5432/tunneltrace_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          APP_ENV: test
          APP_DEBUG: true
          DATABASE_URL: postgresql+asyncpg://tunneltrace_user:tunneltrace_test_password@localhost:5432/tunneltrace_db
          REDIS_URL: redis://localhost:6379/0
          STORAGE_ROOT: ./test_storage
        run: |
          cd backend
          pytest -v --durations=10

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunneltrace-backend"
version = "0.1.0"
description = "TunnelTrace AI — Backend API & Forensics Engine for SIH 2026 / NTRO PS 26160"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TunnelTrace AI Team", email = "dev@tunneltrace.local" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0"
]
lab = [
    # GNU GPL v2. Optional dependency strictly isolated for defensive lab testing
    # and offline PCAP mutation; never loaded in web or production worker runtimes.
    "scapy>=2.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/"]

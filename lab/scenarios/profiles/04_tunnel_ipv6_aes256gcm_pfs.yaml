scenario_id: "scn-04-tunnel-v6-gcm-pfs"
scenario_version: "1.0"
description: "Tunnel Mode IPv6 site-to-site topology with AES-256-GCM, DH Group 19, and PFS enabled."

topology: "TUNNEL_SITE_TO_SITE"
ip_version: "IPV6"
ike_version: "IKEV2"
crypto_profile: "IKEV2_AES256GCM_DH19_PFS"
pfs: "ENABLED"
encapsulation: "NATIVE_ESP"
capture: "BOTH"

traffic_probe:
  packet_count: 5
  interval_sec: 0.2
  payload_size_bytes: 64

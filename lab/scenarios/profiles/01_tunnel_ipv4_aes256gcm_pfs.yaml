scenario_id: "scn-01-tunnel-v4-gcm-pfs"
scenario_version: "1.0"
description: "Baseline Tunnel Mode IPv4 with modern AEAD cipher AES-256-GCM, DH Group 19 (ECP-256), and PFS enabled."

topology: "TUNNEL_SITE_TO_SITE"
ip_version: "IPV4"
ike_version: "IKEV2"
crypto_profile: "IKEV2_AES256GCM_DH19_PFS"
pfs: "ENABLED"
encapsulation: "NATIVE_ESP"
capture: "BOTH"

traffic_probe:
  packet_count: 5
  interval_sec: 0.2
  payload_size_bytes: 64

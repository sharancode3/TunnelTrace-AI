scenario_id: "scn-03-transport-v4-gcm"
scenario_version: "1.0"
description: "Transport Mode host-to-host IPv4 with AES-256-GCM and DH Group 19 directly between peer nodes."

topology: "TRANSPORT_HOST_TO_HOST"
ip_version: "IPV4"
ike_version: "IKEV2"
crypto_profile: "IKEV2_AES256GCM_DH19_PFS"
pfs: "ENABLED"
encapsulation: "NATIVE_ESP"
capture: "WAN"

traffic_probe:
  packet_count: 5
  interval_sec: 0.2
  payload_size_bytes: 64
